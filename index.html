<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Rally">
<title>Rally — USAV Match Tracker</title>
<style>
:root{
  --ink:#0D1A22;
  --panel:#152836;
  --panel2:#1C3345;
  --court:#1D5A8A;
  --free:#C25B33;
  --tape:#EDF1EE;
  --ball:#F2C14E;
  --lib:#4ECDC4;
  --dim:#7796A9;
  --bad:#E4614F;
  --hair:rgba(237,241,238,.14);
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--tape);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 28px}
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);
}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
.card{background:var(--panel);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hair{height:1px;background:var(--hair);margin:12px 0}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input[type=text],input[type=number],select{
  width:100%;background:var(--ink);border:1px solid var(--hair);color:var(--tape);
  border-radius:8px;padding:11px 12px;font-size:16px;font-family:inherit;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
button{font-family:inherit;font-variant-numeric:tabular-nums;cursor:pointer;border:none}
.btn{
  background:var(--panel2);color:var(--tape);border:1px solid var(--hair);
  border-radius:8px;padding:12px 14px;font-size:14px;font-weight:600;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ball);color:#231A05;border-color:var(--ball);font-weight:800}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---- scoreboard ---- */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--panel);border-radius:var(--r);padding:14px 12px;margin-bottom:10px}
.bside{text-align:center;min-width:0}
.bname{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.bname .dot{color:var(--ball)}
.bscore{font-size:52px;line-height:.95;font-weight:800;letter-spacing:-.045em;margin-top:2px}
.bsets{font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-top:4px;font-weight:700}
.bmid{font-size:10px;letter-spacing:.14em;color:var(--dim);text-align:center;font-weight:700}

/* ---- court ---- */
.courtwrap{background:var(--panel);border-radius:var(--r);padding:10px;margin-bottom:10px}
.half{background:#0E2130;border-radius:6px;padding:8px;display:grid;gap:6px;border:1px solid rgba(237,241,238,.1)}
.half.away{background:#0C1C29}
.zrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{
  position:relative;background:rgba(13,26,34,.42);border:1.5px solid rgba(237,241,238,.28);
  border-radius:6px;min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.cell .z{position:absolute;top:3px;left:5px;font-size:9px;font-weight:700;color:rgba(237,241,238,.5)}
.cell .num{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cell .nm{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(237,241,238,.6);
  max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

.cell .ball{position:absolute;top:3px;right:5px;font-size:11px}


.net{height:0;border-top:3px dashed rgba(237,241,238,.55);margin:9px 2px;position:relative}
.net span{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--panel);
  padding:0 8px;font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--dim)}
.tlabel{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:0 2px 5px}
.tlabel .meta{letter-spacing:.06em;font-weight:600}
.rotating .cell{animation:rot .38s ease}
@keyframes rot{0%{transform:scale(.86);opacity:.35}100%{transform:scale(1);opacity:1}}

/* ---- score buttons ---- */
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ptbtn{
  background:var(--panel2);border:1px solid var(--hair);border-radius:var(--r);
  padding:16px 8px;color:var(--tape);text-align:center;
}
.ptbtn .lab{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:inherit;opacity:.72;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ptbtn .big{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:4px;display:block}
.ptbtn:active,.strip .acts .btn:active{filter:brightness(1.28)}

/* ---- team control strips ---- */
.strip{background:var(--panel);border-radius:var(--r);padding:9px 10px;margin-bottom:8px}
.strip .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.strip .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.strip .counts{font-size:10px;letter-spacing:.06em;color:var(--dim);font-weight:600}
.strip .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.strip .acts .btn{padding:10px 4px;font-size:12px;font-weight:700;letter-spacing:.04em}

/* ---- log ---- */
.log{max-height:190px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.li{display:flex;gap:9px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.li:last-child{border-bottom:none}
.li .sc{font-weight:800;font-size:12px;min-width:46px;color:var(--dim);letter-spacing:.02em}
.li .tx{flex:1;color:rgba(237,241,238,.85)}
.li.warn .tx{color:var(--bad)}
.li.lb .tx{color:var(--lib)}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--panel2);border:1px solid var(--hair);color:var(--tape);
  border-radius:8px;padding:9px 0;font-size:16px;font-weight:800;letter-spacing:-.02em;
  min-width:48px;text-align:center;flex:0 0 auto;
}
.chip .sub{display:block;font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-top:1px}
.chip.on{background:var(--ball);color:#231A05;border-color:var(--ball)}
.chip.on .sub{color:#231A05}
.chip.libmark{border-color:var(--lib);color:var(--lib)}
.chip.libmark.on{background:var(--lib);color:#08231F;border-color:var(--lib)}
.chip.used{opacity:.3}
.chip:disabled{opacity:.25}

/* ---- lineup slots ---- */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slot{background:var(--ink);border:1px dashed var(--hair);border-radius:8px;
  padding:10px 4px;text-align:center;color:var(--tape)}
.slot .z{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--dim);display:block}
.slot .v{font-size:20px;font-weight:800;letter-spacing:-.03em;display:block;margin-top:3px}
.slot .v.empty{color:rgba(237,241,238,.2)}
.slot.next{border-style:solid;border-color:var(--ball)}
.slot.filled{border-style:solid;border-color:var(--hair);background:var(--panel2)}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(5,12,17,.72);display:flex;align-items:flex-end;
  justify-content:center;z-index:40}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .18s ease}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 3px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.sheet .sub{font-size:12px;color:var(--dim);margin:0 0 14px;line-height:1.45}
.orow{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--hair);
  border-radius:8px;padding:10px 11px;margin-bottom:6px;width:100%;color:var(--tape);text-align:left}
.orow .z{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--dim);min-width:52px}
.orow .n{font-size:19px;font-weight:800;letter-spacing:-.03em;min-width:34px}
.orow .d{font-size:11px;color:var(--dim);flex:1;line-height:1.35}
.orow.lib{border-color:var(--lib)}
.orow.lib .n{color:var(--lib)}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin:10px 0 0}
.note.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--bad);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;
  z-index:60;max-width:88vw;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.toast.ok{background:var(--lib);color:#08231F}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.key{background:var(--panel2);border:1px solid var(--hair);color:var(--tape);
  border-radius:10px;padding:17px 0;font-size:25px;font-weight:700;letter-spacing:-.02em}
.key:active{background:var(--ball);color:#231A05}
.key.sm{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.key.go{background:var(--ball);color:#231A05;border-color:var(--ball)}
.entry{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.box{background:var(--ink);border:1.5px solid var(--hair);border-radius:9px;
  padding:9px 4px;text-align:center;color:var(--tape);width:100%}
.box .z{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.box .v{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em;margin-top:2px;min-height:27px}
.box .v.empty{color:rgba(237,241,238,.16)}
.box.active{box-shadow:0 0 0 3px var(--tape)}

.box.lib .z{color:var(--lib)}
.box.lib .v{color:var(--lib)}
.buf{background:var(--ink);border:1.5px solid var(--ball);border-radius:9px;padding:12px;
  text-align:center;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.buf.empty{color:rgba(237,241,238,.2);border-color:var(--hair)}

/* ---- score sheet: paper, not app chrome ---- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--panel);border-radius:9px;
  padding:3px;margin-bottom:10px;border:1px solid var(--hair)}
.segb{background:transparent;color:var(--dim);border-radius:7px;padding:9px 0;font-size:12px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.segb.on{background:var(--ball);color:#231A05}
.paper{background:#F7F5EF;color:#14110C;border-radius:6px;padding:11px 9px;margin-bottom:9px;
  font-variant-numeric:tabular-nums}
.phead{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid #14110C;padding-bottom:5px;margin-bottom:8px}
.pset{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.pmatch{flex:1;font-size:10.5px;color:#5A5346;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres{font-size:15px;font-weight:800;letter-spacing:-.02em}
.pres.live{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8271}
.tblock{margin-bottom:9px}
.thead{display:flex;align-items:baseline;gap:7px;font-size:11px;font-weight:700;margin-bottom:4px}
.thead b{font-size:12px;border:1.5px solid #14110C;padding:0 5px;border-radius:3px}
.thead .lb{font-size:9px;letter-spacing:.06em;color:#0E7A6E;font-weight:700}
.thead .fin{margin-left:auto;font-size:16px;font-weight:800;letter-spacing:-.02em}
.thead .fin.win{background:#14110C;color:#F7F5EF;padding:0 6px;border-radius:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ss{border-collapse:collapse;width:100%;min-width:318px;table-layout:fixed}
.ss th,.ss td{border:1px solid #14110C;text-align:center;padding:2px 1px;vertical-align:top}
.ss th{background:#E9E5D9;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 1px}
.ss th.rl{width:24px;font-size:8.5px;background:#DDD8C8}
.ss td{height:26px;position:relative;font-size:10px;line-height:1.15}
.ss td.num{font-size:12.5px;font-weight:800;letter-spacing:-.03em;padding:3px 0;height:auto;word-break:break-all}
.ss td.empty{background:repeating-linear-gradient(135deg,transparent,transparent 4px,#DDD8C8 4px,#DDD8C8 5px)}
.ss .sl{text-decoration:line-through;opacity:.65}
.ss .sep{opacity:.45;margin:0 1px}
.ss .pts{display:block;padding:2px 1px 0;font-size:9.5px;line-height:1.3;word-spacing:2px;word-break:break-word}
.ss .exit{display:block;text-align:right;font-weight:800;font-size:11px;padding:0 2px 1px;
  border-top:1px solid #C9C3B1;margin-top:2px}
.ss .exit.live{color:#8A8271;font-weight:600}
.tri{position:relative;display:inline-block;padding:5px 8px 1px;line-height:1}
.tri svg{position:absolute;left:0;top:0;width:100%;height:100%}
.tri svg polygon{fill:none;stroke:#14110C;stroke-width:1.6}
.tri i{position:relative;top:1px;font-style:normal;font-size:9px}
.rw{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.rl2{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5A5346;min-width:34px}
.run{display:flex;flex-wrap:wrap;gap:1px;flex:1}
.run .p{font-size:9.5px;width:15px;text-align:center;padding:1px 0;border-radius:2px}
.run .p.got{text-decoration:line-through;font-weight:800}
.run .p.void{color:#C6BFAB;text-decoration:line-through}
.run .p.fin{background:#14110C;color:#F7F5EF;text-decoration:none;border-radius:50%;font-weight:800}
.run.sm .p{min-width:13px;font-size:9px}
.anno{font-size:9px;color:#5A5346;letter-spacing:.02em;width:100%}
.pfoot{font-size:8.5px;color:#6B6455;line-height:1.5;border-top:1px solid #C9C3B1;padding-top:5px;margin-top:4px}
.summary .pfoot{border:none;padding:0;font-size:10px;color:#14110C;font-weight:600}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .paper{background:#fff;border:1px solid #14110C;margin-bottom:8px;page-break-inside:avoid;border-radius:0}
  .scroll{overflow:visible}
  .ss{min-width:0}
}

.sws{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(237,241,238,.22);padding:0}
.sw.on{border-color:var(--ball);box-shadow:0 0 0 3px rgba(242,193,78,.28)}
.net.onink span{background:var(--ink)}
.cell .ro{position:absolute;bottom:3px;right:5px;font-size:8.5px;font-weight:800;letter-spacing:.04em;opacity:.5}
.cell .ro.lsv{opacity:1;font-weight:800;letter-spacing:0}
.cell.serving{box-shadow:0 0 0 3px var(--ball)}
.cell.libero{background:var(--lib)!important;color:#06211D!important;border-color:var(--lib)!important;
  box-shadow:0 0 0 3px var(--lib)}
.cell.libero.serving{box-shadow:0 0 0 3px var(--lib),0 0 0 6px var(--ball)}
.swatchdot{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid #14110C;vertical-align:-1px;margin-right:1px}

.rolebox{margin-top:14px;background:var(--panel);border-radius:10px;padding:11px 10px}
.rlab{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.rsys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:11px}
.rsysb{background:var(--ink);border:1px solid var(--hair);color:var(--dim);border-radius:7px;
  padding:9px 2px;font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1.25}
.rsysb.on{background:var(--ball);color:#231A05;border-color:var(--ball)}
.rchips{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.rchip{background:var(--ink);border:1px solid var(--hair);color:var(--tape);border-radius:7px;padding:7px 0}
.rchip.on{border-color:var(--ball);background:rgba(242,193,78,.13)}
.rchip .rn{display:block;font-size:14px;font-weight:800;letter-spacing:-.03em}
.rchip .rr{display:block;font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--dim);margin-top:2px}
.rchip.on .rr{color:var(--ball)}
.cell .rl3{position:absolute;bottom:3px;left:5px;font-size:8px;font-weight:800;letter-spacing:.07em;opacity:.62}
.box .rz{font-size:8px;font-weight:800;letter-spacing:.08em;opacity:.72}

.autolib{margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:9px 0;
  background:transparent;border:1px dashed var(--hair);color:var(--dim)}
.autolib.on{background:rgba(78,205,196,.14);border:1px solid var(--lib);color:var(--lib)}
.cell.held{filter:brightness(1.35)}
.cell{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bigbuf{font-size:38px;font-weight:800;text-align:center;letter-spacing:-.03em;padding:6px 0 12px}
.bigbuf .ph{opacity:.3}

.seg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.posbox{margin-bottom:10px}
.posvg{width:100%;display:block;margin:10px 0 8px;border-radius:8px}
.posok{font-size:11px;color:var(--lib);margin:0 0 6px;line-height:1.45}
.posbad{font-size:11px;color:#FF9F9F;margin:0 0 6px;line-height:1.45;font-weight:600}

.fsbox{background:var(--panel);border:1px solid var(--ball);border-radius:10px;padding:9px 9px 8px;margin-bottom:10px}
.fslab{display:block;font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ball);margin-bottom:7px}
.cell.dragging{opacity:.45}
.cell.droptarget{box-shadow:0 0 0 3px var(--tape)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ============================================================
   Side Out — USAV indoor match tracker
   Rules baked in (USAV 2025-27 domestic):
     - Rally scoring, 25 / deciding set 15, win by 2
     - 15 substitutions per team per set
     - Unlimited individual entries, but a player must always
       re-enter in the SAME serving-order slot
     - Libero: unlimited replacements, back row only, not a sub,
       completed rally required between exchanges, may serve in
       exactly ONE rotation slot per set, up to 2 designated
     - 2 timeouts per team per set
   ============================================================ */

/* ---------- durable storage: window.storage -> localStorage -> memory ---------- */
var store = (function () {
  var mem = {}, mode = "mem";
  try {
    if (window.storage && typeof window.storage.get === "function") mode = "ws";
  } catch (e) {}
  if (mode === "mem") {
    try {
      window.localStorage.setItem("__so__", "1");
      window.localStorage.removeItem("__so__");
      mode = "ls";
    } catch (e) {}
  }
  return {
    get: function (k) {
      try {
        if (mode === "ws") return window.storage.get(k, false).then(function (r) { return r ? r.value : null; }, function () { return null; });
        if (mode === "ls") return Promise.resolve(window.localStorage.getItem(k));
      } catch (e) {}
      return Promise.resolve(mem[k] || null);
    },
    set: function (k, v) {
      try {
        if (mode === "ws") return window.storage.set(k, v, false).catch(function () { mem[k] = v; });
        if (mode === "ls") { window.localStorage.setItem(k, v); return Promise.resolve(); }
      } catch (e) {}
      mem[k] = v;
      return Promise.resolve();
    }
  };
})();

/* ---------- constants ---------- */
var SUB_LIMIT = 15, TIMEOUTS = 2, MAX_LIBEROS = 2;
var ROMAN = ["I", "II", "III", "IV", "V", "VI"];
var BACK_ZONES = [0, 4, 5];              // zone 1, 5, 6 (0-indexed)
var ZONE_NAME = ["Zone 1 · RB", "Zone 2 · RF", "Zone 3 · MF", "Zone 4 · LF", "Zone 5 · LB", "Zone 6 · MB"];
var S = null, sheet = null, rotFlash = [false, false];

/* ---------- helpers ---------- */
var SWATCHES = ["#FFFFFF", "#14181D", "#C8202E", "#123A6B", "#1E6FD9", "#6FB7E8", "#0E7A46",
                "#F2C14E", "#E4702A", "#5B2E8C", "#7A1B2E", "#D96BA0", "#14A39A", "#8A8F98"];

function _srgb(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function _lum(hex) {
  return 0.2126 * _srgb(parseInt(hex.slice(1, 3), 16)) +
         0.7152 * _srgb(parseInt(hex.slice(3, 5), 16)) +
         0.0722 * _srgb(parseInt(hex.slice(5, 7), 16));
}
function _cr(a, b) { var x = _lum(a), y = _lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

/* Fill with the jersey colour when the number stays readable on it;
   otherwise keep the number light and use the colour as an outline. */
function teamStyle(hex) {
  var dark = "#0D1A22", light = "#F6F9F6";
  var cd = _cr(hex, dark), cl = _cr(hex, light), best = Math.max(cd, cl);
  if (best < 4.0) return { fill: "transparent", text: "#EDF1EE", line: hex, outline: true };
  return { fill: hex, text: cd >= cl ? dark : light, line: hex, outline: false };
}
var ROLE_CYCLE = ["S", "OH", "MB", "OPP", "DS", ""];
var ROLE_FULL = { S: "Setter", OH: "Outside", MB: "Middle", OPP: "Opposite", DS: "Def. specialist", L: "Libero" };

/* Roles sit three apart in the serving order — that pairing is what "opposite" means.
   5-1: S opposite OPP.  6-2 / 4-2: the two setters are opposite each other. */
function deriveRoles(setterSlot, system) {
  var pat = system === "6-2" ? ["S", "OH", "MB", "S", "OH", "MB"] : ["S", "OH", "MB", "OPP", "OH", "MB"];
  var out = [null, null, null, null, null, null];
  for (var i = 0; i < 6; i++) out[(setterSlot + i) % 6] = pat[i];
  return out;
}

function btnStyle(ti) {
  var s = tStyle(ti);
  return 'background:' + s.fill + ';color:' + s.text + ';border-color:' + s.line +
         (s.outline ? ';border-width:2px' : "");
}

function tStyle(ti) { return teamStyle(S.teams[ti].color || "#1E6FD9"); }

/* Team name text: keep the jersey colour when it reads on the dark panel,
   otherwise fall back to plain ink — the swatch beside it still shows the colour. */
function nameColor(ti) {
  var c = S.teams[ti].color || "#1E6FD9";
  return _cr(c, "#152836") < 2.6 ? "#EDF1EE" : c;
}


function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function newTeam(name, color) {
  return {
    name: name, color: color || "#1E6FD9", system: "5-1", setterNum: null, roles: null, autoLib: false, libServePlan: null, libServePlanNum: null, roster: [], liberos: [],
    order: [], startOrder: [], rot: 0,
    playerSlot: {},      // jersey -> serving-order slot they are locked to this set
    libOn: null,         // { n: jersey, slot: index }
    libServeSlot: null,  // the one rotation slot the libero may serve from
    lastLibRally: -99, lastLibSlot: -1,  // rally + slot of the last libero exchange
    subs: 0, tos: 0
  };
}
function newMatch() {
  return {
    phase: "setup",
    teams: [newTeam("Home", "#1E6FD9"), newTeam("Away", "#C8202E")],
    target: 25, deciding: 15, bestOf: 5,
    set: 1, score: [0, 0], setsWon: [0, 0], sets: [],
    serve: 0, firstServe: 0, rally: 0, entry: null, events: [], view: "court",
    log: [], undo: [], sideSwitched: false
  };
}

/* rotation math: slot i sits in zone ((i - rot) mod 6) */
function zoneOfSlot(t, slot) { return ((slot - t.rot) % 6 + 6) % 6; }
function slotAtZone(t, z) { return ((z + t.rot) % 6) % 6; }
function occupant(t, slot) { return (t.libOn && t.libOn.slot === slot) ? t.libOn.n : t.order[slot]; }
function atZone(t, z) { return occupant(t, slotAtZone(t, z)); }
function pname(t, n) { var p = t.roster.filter(function (r) { return r.n === n; })[0]; return p ? p.name : ""; }
function onCourt(t) { return t.order.slice().concat(t.libOn ? [t.libOn.n] : []); }
function isDeciding() { return S.setsWon[0] + S.setsWon[1] === S.bestOf - 1; }
function setTarget() { return isDeciding() ? S.deciding : S.target; }
function needSets() { return Math.ceil(S.bestOf / 2); }

/* ---------- log + undo ---------- */
function ev(o) { o.set = S.set; S.events.push(o); }

function say(text, kind) {
  S.log.unshift({ s: S.score[0] + "–" + S.score[1], t: text, k: kind || "" });
  if (S.log.length > 300) S.log.pop();
}
function snap() {
  var u = S.undo; S.undo = [];
  var c = clone(S); S.undo = u;
  u.push(c); if (u.length > 120) u.shift();
}
function undo() {
  if (!S.undo.length) return toast("Nothing to undo");
  var u = S.undo, prev = u.pop();
  prev.undo = u; S = prev; save(); render();
}

/* ---------- toast ---------- */
var toastT = null;
function toast(msg, ok) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var d = document.createElement("div");
  d.className = "toast" + (ok ? " ok" : ""); d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastT);
  toastT = setTimeout(function () { if (d.parentNode) d.remove(); }, 2600);
}

/* ============================================================
   MATCH ACTIONS
   ============================================================ */
function rotate(ti) {
  var t = S.teams[ti];
  t.rot++;
  rotFlash[ti] = true;
  // libero cannot rotate into the front row — the replaced player comes back
  if (t.libOn && BACK_ZONES.indexOf(zoneOfSlot(t, t.libOn.slot)) === -1) {
    var back = t.order[t.libOn.slot], lib = t.libOn.n;
    t.lastLibSlot = t.libOn.slot;
    t.libOn = null; t.lastLibRally = S.rally;
    say(t.name + ": #" + lib + " out to the front row, #" + back + " back in", "lb");
  }
}

/* Auto libero tracking.
   Middles sit three apart in the serving order, so exactly one of them is
   always in the back row. The libero shadows whichever middle that is:
   in when the middle reaches the back row, out when that spot rotates to
   the front — at which moment the other middle has just arrived in the back.

   Two cases where we hold off rather than act:
   - the spot is at zone 1 and the team must serve from it, and the libero's
     serving slot is already committed elsewhere. The middle serves that turn.
   - no libero registered, or roles never tagged.
   Returns the slot to fill, or null. */
/* Which slot the libero is permitted to serve from: the rule-lock once they've
   actually served, otherwise the coach's declared plan. */
function servePermit(t) {
  return t.libServeSlot !== null ? t.libServeSlot : t.libServePlan;
}

function autoLiberoTargetFor(t, rally, serving) {
  if (!t.autoLib || !t.liberos.length || !t.roles) return null;
  if (t.libOn) return null;
  for (var slot = 0; slot < 6; slot++) {
    if (t.roles[slot] !== "MB") continue;
    var z = zoneOfSlot(t, slot);
    if (BACK_ZONES.indexOf(z) === -1) continue;
    // would have to serve from here, but the libero is committed to another slot
    var permit = servePermit(t);
    if (z === 0 && serving && permit !== null && permit !== slot) return null;
    if (t.lastLibRally === rally && t.lastLibSlot === slot) return null;
    return slot;
  }
  return null;
}
function autoLiberoTarget(ti) {
  return autoLiberoTargetFor(S.teams[ti], S.rally, S.serve === ti);
}

function runAutoLibero(ti) {
  var t = S.teams[ti];
  if (!t.autoLib) return;
  if (t.libOn && zoneOfSlot(t, t.libOn.slot) === 0 && S.serve === ti) {
    var permit = servePermit(t);
    if (permit !== null && permit !== t.libOn.slot) {
      var lib = t.libOn.n, back = t.order[t.libOn.slot];
      t.lastLibSlot = t.libOn.slot;
      t.libOn = null; t.lastLibRally = S.rally;
      say(t.name + ": #" + lib + " out so #" + back + " can serve (auto)", "lb");
    }
  }
  var slot = autoLiberoTarget(ti);
  if (slot === null) return;
  t.libOn = { n: t.liberos[0], slot: slot };
  t.lastLibRally = S.rally;
  ev({ k: "libin", t: ti, slot: slot, n: t.libOn.n, "for": t.order[slot], a: S.score[0], b: S.score[1] });
  say(t.name + ": libero #" + t.libOn.n + " in for #" + t.order[slot] + " (auto)", "lb");
  checkLiberoServe(ti);
}

function checkLiberoServe(ti) {
  var t = S.teams[ti];
  if (!t.libOn) return;
  // standing in zone 1 while receiving is not serving — the rule only fixes the
  // slot once the libero actually serves from it
  if (S.serve !== ti) return;
  var serveSlot = slotAtZone(t, 0);
  if (t.libOn.slot !== serveSlot) return;           // libero isn't the server
  if (t.libServeSlot === null) {
    t.libServeSlot = serveSlot;
    ev({ k: "libserve", t: ti, slot: serveSlot, n: t.libOn.n });
    say(t.name + ": #" + t.libOn.n + " locked into serving order " + ROMAN[serveSlot] + " — her only serving slot this set", "lb");
  } else if (t.libServeSlot !== serveSlot) {
    say(t.name + ": ILLEGAL — libero already served from another slot this set", "warn");
    toast("Libero may only serve from one rotation slot");
  }
}

function point(ti) {
  if (S.phase !== "match") return;
  snap();
  var t = S.teams[ti], sideOut = S.serve !== ti;
  S.score[ti]++;
  S.rally++;
  if (sideOut) { S.serve = ti; rotate(ti); }
  ev({ k: "pt", t: ti, a: S.score[0], b: S.score[1], so: sideOut, srv: atZone(t, 0) });
  say(t.name + " point" + (sideOut ? " · side out, rotate" : " · #" + atZone(t, 0) + " serving again"));
  runAutoLibero(0); runAutoLibero(1);
  checkLiberoServe(ti);
  // side switch reminder in the deciding set
  if (isDeciding() && !S.sideSwitched && (S.score[0] >= 8 || S.score[1] >= 8)) {
    S.sideSwitched = true;
    say("Switch sides — 8 points in the deciding set", "warn");
    toast("Switch sides (8 in the deciding set)", true);
  }
  checkSetEnd();
  save(); render();
}

function checkSetEnd() {
  var tg = setTarget(), a = S.score[0], b = S.score[1];
  var w = (a >= tg && a - b >= 2) ? 0 : (b >= tg && b - a >= 2) ? 1 : -1;
  if (w < 0) return;
  S.setsWon[w]++;
  S.sets.push({ a: a, b: b, set: S.set, w: w });
  ev({ k: "end", w: w, a: a, b: b });
  say(S.teams[w].name + " takes set " + S.set + ", " + a + "–" + b);
  S.phase = (S.setsWon[w] === needSets()) ? "matchover" : "setover";
}

function timeout(ti) {
  var t = S.teams[ti];
  if (t.tos >= TIMEOUTS) return toast(t.name + " has no timeouts left this set");
  snap(); t.tos++;
  ev({ k: "to", t: ti, a: S.score[0], b: S.score[1], n: t.tos });
  say(t.name + " timeout (" + t.tos + " of " + TIMEOUTS + ")");
  save(); render();
}

/* ---------- substitutions ---------- */
function subEligible(t, slot) {
  var court = onCourt(t);
  return t.roster.filter(function (p) {
    return !p.lib && court.indexOf(p.n) === -1 && t.playerSlot[p.n] === slot;
  }).map(function (p) { return p.n; });
}

/* Why a number can't go into this spot — null means it's fine. */
function subProblem(t, slot, n) {
  if (!n) return "Punch in a jersey number";
  if (t.subs >= SUB_LIMIT) return SUB_LIMIT + " subs used — none left this set";
  if (t.libOn && t.libOn.slot === slot) return "Take the libero out of that spot first";
  if (onCourt(t).indexOf(n) !== -1) return "#" + n + " is already on the court";
  if (t.liberos.indexOf(n) !== -1) return "#" + n + " is your libero — use Libero in";
  var locked = t.playerSlot[n];
  if (locked !== undefined && locked !== slot) {
    return "#" + n + " already entered this set in zone " + (zoneOfSlot(t, locked) + 1) + "'s spot";
  }
  return null;
}

function doSub(ti, slot, inN) {
  var t = S.teams[ti];
  var bad = subProblem(t, slot, inN);
  if (bad) return toast(bad);
  snap();
  var outN = t.order[slot];
  t.order[slot] = inN;
  t.playerSlot[inN] = slot;
  t.playerSlot[outN] = slot;
  t.subs++;
  if (!t.roster.some(function (p) { return p.n === inN; })) t.roster.push({ n: inN, lib: false });
  ev({ k: "sub", t: ti, slot: slot, out: outN, "in": inN, a: S.score[0], b: S.score[1], n: t.subs });
  say(t.name + ": #" + inN + " in for #" + outN + " (Zone " + (zoneOfSlot(t, slot) + 1) + ") · sub " + t.subs + " of " + SUB_LIMIT);
  save(); closeSheet(); render();
}

function toggleAutoLib(ti) {
  var t = S.teams[ti];
  if (!t.autoLib) {
    if (!t.liberos.length) return toast(t.name + " has no libero registered this set");
    if (!t.roles) return toast("Tag the setter first — long-press a player to do it");
  }
  snap();
  t.autoLib = !t.autoLib;
  if (t.autoLib) {
    say(t.name + ": libero tracking on — following the back-row middle", "lb");
    runAutoLibero(ti);
    toast("Libero tracking on", true);
  } else {
    say(t.name + ": libero tracking off", "lb");
    toast("Libero tracking off");
  }
  save(); render();
}

function setFirstServe(ti) {
  if (S.score[0] || S.score[1]) return toast("Too late to change — the set has already started");
  snap();
  S.serve = ti; S.firstServe = ti;
  for (var i = 0; i < S.events.length; i++) {
    if (S.events[i].set === S.set && S.events[i].k === "start") { S.events[i].srv = ti; break; }
  }
  say(S.teams[ti].name + " serves first", "lb");
  save(); render();
}

/* Nudge a team round the rotation without touching the score. For when the
   rotation on the app and the rotation on the court have drifted apart. */
function nudgeRotation(ti, dir) {
  var t = S.teams[ti];
  snap();
  t.rot = (t.rot + dir + 6) % 6;
  if (t.libOn && BACK_ZONES.indexOf(zoneOfSlot(t, t.libOn.slot)) === -1) {
    var lib = t.libOn.n, back = t.order[t.libOn.slot];
    t.lastLibSlot = t.libOn.slot; t.libOn = null; t.lastLibRally = S.rally;
    say(t.name + ": #" + lib + " out to the front row, #" + back + " back in", "lb");
  }
  rotFlash[ti] = true;
  say(t.name + ": rotation nudged " + (dir > 0 ? "forward" : "back") + " — score unchanged", "lb");
  save(); render();
}

/* Swap two players between spots in the serving order. Roles follow the setter,
   so they re-derive around wherever the setter ended up. */
function swapSlots(ti, a, bslot) {
  var t = S.teams[ti];
  if (a === bslot) return;
  if (t.libOn && (t.libOn.slot === a || t.libOn.slot === bslot)) {
    return toast("Take the libero out before swapping that spot");
  }
  snap();
  var tmp = t.order[a];
  t.order[a] = t.order[bslot];
  t.order[bslot] = tmp;
  t.playerSlot[t.order[a]] = a;
  t.playerSlot[t.order[bslot]] = bslot;
  if (t.startOrder && t.startOrder.length === 6) {
    var s0 = t.startOrder[a]; t.startOrder[a] = t.startOrder[bslot]; t.startOrder[bslot] = s0;
  }
  if (t.setterNum) {
    var si = t.order.indexOf(t.setterNum);
    t.roles = si === -1 ? t.roles : deriveRoles(si, t.system || "5-1");
  }
  if (t.libServePlanNum) {
    var pi = t.order.indexOf(t.libServePlanNum);
    t.libServePlan = pi === -1 ? null : pi;
  }
  // a swap is normally fixing a line-up typed wrong, so the sheet's service
  // order should match what actually took the court
  for (var i = 0; i < S.events.length; i++) {
    var e = S.events[i];
    if (e.set === S.set && e.k === "start") {
      var L = e.lineups[ti], sw = L[a]; L[a] = L[bslot]; L[bslot] = sw;
      break;
    }
  }
  say(t.name + ": swapped #" + t.order[bslot] + " and #" + t.order[a] + " in the order", "lb");
  save(); render();
}

/* ---------- fixing a mistyped number ---------- */
/* Not a substitution: the player was always there, we just typed them wrong.
   No sub is spent, no slot lock is created, and the score sheet is rewritten
   so the set reads as if the right number had been entered all along. */
function correctProblem(t, slot, n, isLib) {
  if (!n) return "Punch in a jersey number";
  var court = onCourt(t);
  var self = isLib ? (t.libOn && t.libOn.n) : t.order[slot];
  if (n === self) return null;
  if (court.indexOf(n) !== -1) return "#" + n + " is already on the court";
  if (!isLib && t.liberos.indexOf(n) !== -1) return "#" + n + " is your libero";
  if (isLib && t.order.indexOf(n) !== -1) return "#" + n + " is in the serving order";
  return null;
}

function correctNumber(ti, slot, newN, isLib) {
  var t = S.teams[ti];
  var bad = correctProblem(t, slot, newN, isLib);
  if (bad) return toast(bad);
  var oldN = isLib ? t.libOn.n : t.order[slot];
  if (oldN === newN) { closeSheet(); return; }
  snap();

  if (isLib) {
    var li = t.liberos.indexOf(oldN);
    if (li !== -1) t.liberos[li] = newN;
    if (t.libOn) t.libOn.n = newN;
  } else {
    t.order[slot] = newN;
    if (t.playerSlot[oldN] === slot) delete t.playerSlot[oldN];
    t.playerSlot[newN] = slot;
    if (t.startOrder && t.startOrder[slot] === oldN) t.startOrder[slot] = newN;
    if (t.setterNum === oldN) t.setterNum = newN;
  }
  t.roster.forEach(function (p) { if (p.n === oldN) p.n = newN; });

  // rewrite this set's events so the score sheet matches
  S.events.forEach(function (e) {
    if (e.set !== S.set || e.t !== ti) {
      if (e.k === "start" && e.set === S.set) {
        if (!isLib) { e.lineups[ti] = e.lineups[ti].map(function (v) { return v === oldN ? newN : v; }); }
        else { e.liberos[ti] = e.liberos[ti].map(function (v) { return v === oldN ? newN : v; }); }
      }
      return;
    }
    if (e.k === "sub") { if (e.out === oldN) e.out = newN; if (e["in"] === oldN) e["in"] = newN; }
    if (e.k === "libin") { if (e.n === oldN) e.n = newN; if (e["for"] === oldN) e["for"] = newN; }
    if (e.k === "libserve" && e.n === oldN) e.n = newN;
  });

  say(t.name + ": corrected #" + oldN + " to #" + newN + (isLib ? " (libero)" : ""), "lb");
  toast("Fixed — #" + oldN + " is now #" + newN, true);
  save(); closeSheet(); render();
}

/* Tag the setter mid-match; the other five roles follow from the
   three-apart pattern and ride along through subs and rotations. */
function setLiberoServeSpot(ti, slot) {
  var t = S.teams[ti];
  if (t.libServeSlot !== null && t.libServeSlot !== slot) {
    return toast("Libero already served from " + ROMAN[t.libServeSlot] + " this set — that's locked");
  }
  snap();
  if (t.libServePlan === slot) {
    t.libServePlan = null; t.libServePlanNum = null;
    say(t.name + ": libero serving spot cleared", "lb");
  } else {
    t.libServePlan = slot;
    t.libServePlanNum = t.order[slot];
    say(t.name + ": libero will serve in " + ROMAN[slot] + " (#" + t.order[slot] + "'s spot)", "lb");
  }
  save(); closeSheet(); render();
}

function setSetter(ti, slot) {
  var t = S.teams[ti];
  snap();
  t.roles = deriveRoles(slot, t.system || "5-1");
  t.setterNum = t.order[slot];
  say(t.name + ": #" + t.order[slot] + " tagged as setter (" + ROMAN[slot] + ")", "lb");
  save(); closeSheet(); render();
}

/* ---------- libero ---------- */
function liberoIn(ti, libN, slot) {
  var t = S.teams[ti];
  if (BACK_ZONES.indexOf(zoneOfSlot(t, slot)) === -1) return toast("The libero can only replace a back-row player");
  var isServeSpot = zoneOfSlot(t, slot) === 0 && S.serve === ti;
  // A rally must finish before the libero re-enters the SAME slot. Swapping to a
  // different back-row slot in the same dead ball is legal (USAV 19.3.2.1 case).
  if (t.lastLibRally === S.rally && t.lastLibSlot === slot && !isServeSpot) {
    return toast("A rally has to finish before #" + libN + " goes back into that spot");
  }
  if (t.libServeSlot !== null && zoneOfSlot(t, slot) === 0 && S.serve === ti && t.libServeSlot !== slot) {
    return toast("Libero already has a serving slot this set");
  }
  snap();
  t.libOn = { n: libN, slot: slot };
  t.lastLibRally = S.rally;
  ev({ k: "libin", t: ti, slot: slot, n: libN, "for": t.order[slot], a: S.score[0], b: S.score[1] });
  say(t.name + ": libero #" + libN + " in for #" + t.order[slot] + " (" + ZONE_NAME[zoneOfSlot(t, slot)].split(" · ")[0] + ")", "lb");
  checkLiberoServe(ti);
  save(); closeSheet(); render();
}
function liberoOut(ti) {
  var t = S.teams[ti];
  if (!t.libOn) return;
  snap();
  var lib = t.libOn.n, back = t.order[t.libOn.slot];
  t.lastLibSlot = t.libOn ? t.libOn.slot : -1;
  t.libOn = null; t.lastLibRally = S.rally;
  say(t.name + ": libero #" + lib + " out, #" + back + " back in", "lb");
  save(); closeSheet(); render();
}

/* ============================================================
   SETUP
   ============================================================ */
function startMatch() {
  S.teams[0].name = ($("n0").value || "Home").trim();
  S.teams[1].name = ($("n1").value || "Away").trim();
  S.target = parseInt($("tgt").value, 10) || 25;
  S.deciding = parseInt($("dec").value, 10) || 15;
  S.bestOf = parseInt($("bo").value, 10) || 5;
  S.serve = S.firstServe = 0;   // confirmed on the match screen, after the toss
  S.phase = "lineup"; S.lineupFor = 0; S.entry = entryFor(0);
  save(); render();
}

function confirmLineup(ti) {
  var e = S.entry, t = S.teams[ti];
  var six = e.z.slice(), libs = e.lib.filter(function (v) { return v; });
  if (six.filter(function (v) { return v; }).length !== 6) return toast("Fill all six spots");
  var seen = {}, dupe = null;
  six.concat(libs).forEach(function (n) { if (seen[n]) dupe = n; seen[n] = 1; });
  if (dupe) return toast("#" + dupe + " is listed twice");

  t.order = six;
  t.startOrder = six.slice();
  t.playerSlot = {};
  six.forEach(function (n, i) { t.playerSlot[n] = i; });
  t.liberos = libs;
  t.libServePlan = null;
  if (t.libServePlanNum) {
    var pi = six.indexOf(t.libServePlanNum);
    if (pi !== -1) t.libServePlan = pi;
  }
  // setter carries between sets by jersey number; roles re-derive around wherever they landed
  if (t.setterNum) {
    var si = six.indexOf(t.setterNum);
    t.roles = si === -1 ? null : deriveRoles(si, t.system || "5-1");
  } else {
    t.roles = null;
  }
  t.roster = six.map(function (n) { return { n: n, lib: false }; })
    .concat(libs.map(function (n) { return { n: n, lib: true }; }));

  if (ti === 0 && !S.teams[1].order.length) {
    S.lineupFor = 1; S.entry = entryFor(1);
  } else {
    S.phase = "match"; S.entry = null;
    ev({ k: "start", srv: S.serve,
         lineups: [S.teams[0].order.slice(), S.teams[1].order.slice()],
         liberos: [S.teams[0].liberos.slice(), S.teams[1].liberos.slice()] });
    say("Set " + S.set + " · " + S.teams[S.serve].name + " serving, #" + atZone(S.teams[S.serve], 0) + " up");
  }
  save(); render();
}

function nextSet() {
  S.set++;
  S.score = [0, 0];
  S.rally = 0;
  S.sideSwitched = false;
  S.firstServe = 1 - S.firstServe;
  S.serve = S.firstServe;
  S.teams.forEach(function (t) {
    t.rot = 0; t.subs = 0; t.tos = 0; t.libOn = null;
    t.libServeSlot = null; t.lastLibRally = -99; t.lastLibSlot = -1;
    t.prevLib = t.liberos.slice();
    t.order = []; t.playerSlot = {}; t.roster = []; t.liberos = [];
  });
  S.entry = entryFor(0);
  S.undo = [];
  say("— Set " + S.set + " —");
  S.phase = "lineup"; S.lineupFor = 0;
  save(); render();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  var a = $("app");
  if (S.phase === "setup") a.innerHTML = viewSetup();
  else if (S.phase === "lineup") a.innerHTML = viewLineup();
  else if (S.phase === "setover" || S.phase === "matchover") a.innerHTML = viewBreak();
  else a.innerHTML = viewMatch();
  wire();
  if (sheet) drawSheet();
  rotFlash = [false, false];
}

function teamSetup(i) {
  var t = S.teams[i];

}

function viewSetup() {

/* ---------- line-up entry: on-screen keypad, laid out like the court ---------- */
function blankEntry() { return { z: ["", "", "", "", "", ""], lib: ["", ""], active: 0, roles: null }; }

/* Sets 2+ open on the previous set's starters. Nothing is focused, so a stray
   keypad tap can't rewrite a spot — you tap the one you want to change. */
function entryFor(ti) {
  var t = S.teams[ti], e = blankEntry();
  if (t.startOrder && t.startOrder.length === 6) {
    e.z = t.startOrder.slice();
    e.lib = [(t.prevLib && t.prevLib[0]) || "", (t.prevLib && t.prevLib[1]) || ""];
    e.roles = t.roles ? t.roles.slice() : null;
    e.active = -1;
    e.prefilled = true;
    e.wasPrefilled = true;
  }
  return e;
}

function entryBox(i) {
  var e = S.entry, lib = i >= 6;
  var v = lib ? e.lib[i - 6] : e.z[i];
  var lab = lib ? (i === 6 ? "Libero" : "Libero 2") : "Zone " + (i + 1) + (i === 0 ? " · serves" : "");
  var s = tStyle(S.lineupFor), sty = "";
  if (!lib && v) sty = 'background:' + s.fill + ';color:' + s.text + ';border-color:' + s.line;
  else sty = 'border-color:' + (lib ? "rgba(78,205,196,.5)" : s.line);
  return '<button class="box' + (lib ? " lib" : "") + (e.active === i ? " active" : "") +
    '" data-box="' + i + '" style="' + sty + '">' +
    '<span class="z"' + (!lib && v ? ' style="color:inherit;opacity:.7"' : "") + '>' + lab +
      (!lib && e.roles && e.roles[i] ? ' <span class="rz">· ' + e.roles[i] + '</span>' : "") + '</span>' +
    '<span class="v' + (v ? "" : " empty") + '">' + (v ? esc(v) : "–") + '</span></button>';
}

function viewLineup() {
  var ti = S.lineupFor, t = S.teams[ti], e = S.entry;
  var filled = e.z.filter(function (v) { return v; }).length;

    (e.prefilled ? '<p class="note" style="margin:-8px 0 12px;color:var(--ball)">Last set\'s starters — tap any spot to change it.</p>' : "") +

function rolePicker(ti, filled) {

function keypad(okLabel) {
  var k = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(function (d) {

}

function advanceEntry() {
  var e = S.entry, i = e.active;
  if (i >= 6) { e.active = i === 6 && !e.lib[1] ? 7 : i; save(); render(); return; }
  for (var s = 1; s <= 6; s++) {
    var j = (i + s) % 6;
    if (!e.z[j]) { e.active = j; save(); render(); return; }
  }
  // fresh line-up: roll on to the libero. Editing a carried-over one: just let go.
  e.active = e.wasPrefilled ? -1 : 6;
  save(); render();
}

function entryKey(d) {
  var e = S.entry, i = e.active, lib = i >= 6;
  if (i < 0) {
    if (d === "ok") { e.active = 0; save(); render(); return; }
    return toast("Tap the spot you want to change");
  }
  var cur = lib ? e.lib[i - 6] : e.z[i];
  if (d === "ok") return advanceEntry();
  if (d === "del") cur = cur.slice(0, -1);
  else { if (cur.length >= 2) cur = ""; cur += d; }
  if (lib) e.lib[i - 6] = cur; else e.z[i] = cur;
  // two digits is a complete jersey number — move on without another tap
  if (d !== "del" && cur.length === 2) return advanceEntry();
  save(); render();
}

function viewBreak() {
