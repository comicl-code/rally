/* ============================================================
   SCORE SHEET — rebuilt from the event stream, USAV layout
   Service Order I–VI, service-round boxes with exit scores,
   slashed substitutions, triangle on the libero's serving slot.
   ============================================================ */
function buildSheet(setNo) {
  var evs = S.events.filter(function (e) { return e.set === setNo; });
  var st = null;
  for (var i = 0; i < evs.length; i++) if (evs[i].k === "start") { st = evs[i]; break; }
  if (!st) return null;

  var sheet = {
    set: setNo, lineups: st.lineups, liberos: st.liberos,
    terms: [[], []], subs: [[], []], tos: [[], []],
    libServe: [null, null], score: [0, 0], done: null
  };
  var count = [0, 0];
  function openTerm(t) {
    var i = count[t]++;
    var term = { slot: i % 6, round: Math.floor(i / 6) + 1, pts: [], exit: null, open: true };
    sheet.terms[t].push(term);
    return term;
  }
  var srv = st.srv, cur = [null, null];
  cur[srv] = openTerm(srv);

  evs.forEach(function (e) {
    if (e.k === "pt") {
      sheet.score = [e.a, e.b];
      var mine = e.t === 0 ? e.a : e.b;
      if (e.t === srv) {
        cur[srv].pts.push(mine);                    // point held on their own serve
      } else {
        cur[srv].exit = srv === 0 ? e.a : e.b;      // outgoing server's exit score
        cur[srv].open = false;
        srv = e.t;
        cur[srv] = openTerm(srv);
        cur[srv].pts.push(mine);                    // the side-out point opens the new term
      }
    } else if (e.k === "sub") {
      sheet.subs[e.t].push(e);
    } else if (e.k === "to") {
      sheet.tos[e.t].push(e);
    } else if (e.k === "libserve") {
      sheet.libServe[e.t] = e.slot;
    } else if (e.k === "end") {
      sheet.done = e;
    }
  });
  [0, 1].forEach(function (t) {
    var last = sheet.terms[t][sheet.terms[t].length - 1];
    if (last && last.exit === null) last.exit = sheet.score[t];
  });
  return sheet;
}

/* every number that has ever occupied a serving-order slot, in order */
function slotHistory(sh, t, slot) {
  var out = [sh.lineups[t][slot]];
  sh.subs[t].forEach(function (s) { if (s.slot === slot) out.push(s["in"]); });
  return out;
}

function ssTeam(sh, t, name) {
  var rounds = 0;
  sh.terms[t].forEach(function (x) { rounds = Math.max(rounds, x.round); });
  var grid = {};
  sh.terms[t].forEach(function (x) { grid[x.round + ":" + x.slot] = x; });

  var head = '<tr><th class="rl"></th>' + ROMAN.map(function (r, i) {
    var tri = sh.libServe[t] === i;
    return '<th>' + (tri ? '<span class="tri"><svg viewBox="0 0 22 20" preserveAspectRatio="none">' +
      '<polygon points="11,1.5 20.5,18.5 1.5,18.5"/></svg><i>' + r + '</i></span>' : r) + '</th>';
  }).join("") + '</tr>';

  var players = '<tr><th class="rl">Nº</th>' + [0, 1, 2, 3, 4, 5].map(function (i) {
    var hist = slotHistory(sh, t, i);
    return '<td class="num">' + hist.map(function (n, k) {
      return k < hist.length - 1 ? '<span class="sl">' + esc(n) + '</span>' : esc(n);
    }).join('<span class="sep">/</span>') + '</td>';
  }).join("") + '</tr>';

  var body = "";
  for (var r = 1; r <= Math.max(rounds, 1); r++) {
    body += '<tr><th class="rl">R' + r + '</th>' + [0, 1, 2, 3, 4, 5].map(function (i) {
      var x = grid[r + ":" + i];
      if (!x) return '<td class="empty"></td>';
      return '<td><span class="pts">' + (x.pts.length ? x.pts.join(" ") : "&nbsp;") + '</span>' +
        '<span class="exit' + (sh.done && !x.open ? "" : " live") + '">' + x.exit + '</span></td>';
    }).join("") + '</tr>';
  }

  // running score: earned points slashed, unearned cancelled
  var final = sh.score[t], cap = Math.max(final, sh.set === 5 ? 15 : 25);
  var run = "";
  for (var p = 1; p <= cap; p++) {
    var earned = p <= final;
    var isFinal = sh.done && sh.done.w === t && p === final;
    run += '<span class="p' + (earned ? " got" : " void") + (isFinal ? " fin" : "") + '">' + p + '</span>';
  }

  var subs = "";
  for (var s = 1; s <= SUB_LIMIT; s++) {
    subs += '<span class="p' + (s <= sh.subs[t].length ? " got" : "") + '">' + s + '</span>';
  }

  return '<div class="tblock">' +
    '<div class="thead"><b>' + (t === 0 ? "A" : "B") + '</b> <span class="swatchdot" style="background:' +
      S.teams[t].color + '"></span> ' + esc(name) +
      (sh.liberos[t].length ? '<span class="lb">L ' + sh.liberos[t].map(function (n) { return "#" + n; }).join(" ") + '</span>' : "") +
      '<span class="fin' + (sh.done && sh.done.w === t ? " win" : "") + '">' + sh.score[t] + '</span></div>' +
    '<div class="scroll"><table class="ss">' + head + players + body + '</table></div>' +
    '<div class="rw"><span class="rl2">Points</span><span class="run">' + run + '</span></div>' +
    '<div class="rw"><span class="rl2">Subs</span><span class="run sm">' + subs + '</span>' +
      (sh.subs[t].length ? '<span class="anno">' + sh.subs[t].map(function (x) {
        return "#" + x["in"] + " for #" + x.out + " at " + (t === 0 ? x.a + ":" + x.b : x.b + ":" + x.a);
      }).join("  ·  ") + '</span>' : "") + '</div>' +
    '<div class="rw"><span class="rl2">T/O</span><span class="run sm">' +
      [1, 2].map(function (k) { return '<span class="p' + (k <= sh.tos[t].length ? " got" : "") + '">' + k + '</span>'; }).join("") + '</span>' +
      (sh.tos[t].length ? '<span class="anno">' + sh.tos[t].map(function (x) {
        return (t === 0 ? x.a + ":" + x.b : x.b + ":" + x.a);
      }).join("  ") + '</span>' : "") + '</div>' +
  '</div>';
}

function ssSet(setNo) {
  var sh = buildSheet(setNo);
  if (!sh) return "";
  return '<div class="paper">' +
    '<div class="phead"><span class="pset">Set ' + setNo + '</span>' +
      '<span class="pmatch">' + esc(S.teams[0].name) + " v " + esc(S.teams[1].name) + '</span>' +
      (sh.done ? '<span class="pres">' + sh.score[0] + "–" + sh.score[1] + '</span>' : '<span class="pres live">in progress</span>') +
    '</div>' +
    ssTeam(sh, 0, S.teams[0].name) +
    ssTeam(sh, 1, S.teams[1].name) +
    '<div class="pfoot">Service Order I–VI · a triangle marks the libero\'s serving slot · slashed numbers left the court · exit score sits bottom-right of each service round</div>' +
  '</div>';
}

function viewSheetAll() {
  var out = "", n;
  for (n = 1; n <= S.set; n++) out += ssSet(n);
  var res = S.sets.map(function (s) { return "Set " + s.set + ": " + s.a + "–" + s.b; }).join("  ·  ");
  return '<div class="paper summary">' +
      '<div class="phead"><span class="pset">Match</span>' +
      '<span class="pmatch">' + esc(S.teams[0].name) + " v " + esc(S.teams[1].name) + '</span>' +
      '<span class="pres">' + S.setsWon[0] + "–" + S.setsWon[1] + '</span></div>' +
      '<div class="pfoot">' + (res || "no completed sets yet") + '</div>' +
    '</div>' + out;
}

/* ============================================================
   POSITIONS — where everyone stands before the serve
   Court is 9m wide, 18m long, attack lines 3m off the net.
   Screen layout matches the match view: home upper, away lower,
   mirrored so home zone 2 faces away zone 4 across the net.
   ============================================================ */
var CW = 9, CL = 18;                       // court metres
var HOME_X = { 1: 1.5, 2: 1.5, 3: 4.5, 4: 7.5, 5: 7.5, 6: 4.5 };
var AWAY_X = { 1: 7.5, 2: 7.5, 3: 4.5, 4: 1.5, 5: 1.5, 6: 4.5 };
var FRONT_ZONES = [2, 3, 4];

/* Overlap pairs that the rule constrains (USAV 7.4):
   lateral order inside each row, and each back-row player behind their front counterpart. */
var OVERLAP_LR = [[4, 3], [3, 2], [5, 6], [6, 1]];   // first must be left of second (team's own view)
var OVERLAP_FB = [[4, 5], [3, 6], [2, 1]];           // front zone, its back counterpart

function zoneOf(ti, z) { return ti === 0 ? HOME_X[z] : AWAY_X[z]; }

/* Rotational base: the legal reference spot for each zone. */
function basePos(ti, z) {
  var front = FRONT_ZONES.indexOf(z) !== -1;
  var y = ti === 0 ? (front ? 7.5 : 3.0) : (front ? 10.5 : 15.0);
  return { x: zoneOf(ti, z), y: y };
}

/* Serve-receive template. Passers spread across an arc; the setter releases
   toward their own right front; everyone else waits at the net to hit. */
/* Positive amount moves toward the team's OWN left, which is screen-right
   for home and screen-left for away. */
function shiftX(ti, x, amount) {
  var v = ti === 0 ? x + amount : x - amount;
  return Math.max(0.85, Math.min(CW - 0.85, v));
}

function receivePos(ti, z, role, passers, isServer) {
  var nearNet = ti === 0 ? 7.6 : 10.4;
  var deep = function (m) { return ti === 0 ? m : CL - m; };
  var shift = S.shift === "L" ? 1.25 : S.shift === "R" ? -1.25 : 0;
  var dz = S.rdepth === "up" ? 1.3 : S.rdepth === "deep" ? -1.3 : 0;
  var setterSide = ti === 0 ? 2.5 : CW - 2.5;         // own right front
  if (role === "S") return { x: setterSide, y: nearNet };
  var order = passers === 2 ? [2.9, 6.1] : passers === 3 ? [1.9, 4.5, 7.1] : [1.5, 3.5, 5.5, 7.5];
  var idx = passerIndex(ti, z, passers);
  if (idx !== -1) {
    var depth = passers === 2 ? 5.0 : passers === 3 ? 4.3 : 3.7;
    // wings hang a little deeper than the middle, giving the shallow arc
    var bump = passers === 3 ? (idx === 1 ? 0.55 : 0) : passers === 4 ? (idx === 0 || idx === 3 ? -0.35 : 0.3) : 0;
    return { x: shiftX(ti, order[idx], shift), y: deep(depth + bump + dz) };
  }
  var frontRow = FRONT_ZONES.indexOf(z) !== -1;
  return { x: shiftX(ti, zoneOf(ti, z), shift * 0.45), y: frontRow ? nearNet : deep(6.5) };
}

/* Which players receive. Libero always passes; then outsides; then whoever is left,
   never the setter, and never a front-row middle. */
function passerZones(ti, passers) {
  var t = S.teams[ti], out = [];
  var cand = [];
  for (var slot = 0; slot < 6; slot++) {
    var z = zoneOfSlot(t, slot) + 1;
    var role = t.roles ? t.roles[slot] : null;
    var isLib = !!(t.libOn && t.libOn.slot === slot);
    if (role === "S") continue;
    if (role === "MB" && !isLib && FRONT_ZONES.indexOf(z) !== -1) continue;
    cand.push({ z: z, role: role, isLib: isLib, back: FRONT_ZONES.indexOf(z) === -1 });
  }
  cand.sort(function (a, b) {
    var rank = function (c) { return c.isLib ? 0 : c.role === "OH" ? 1 : c.back ? 2 : 3; };
    return rank(a) - rank(b);
  });
  for (var i = 0; i < cand.length && out.length < passers; i++) out.push(cand[i].z);
  // left-to-right on screen so the arc reads naturally
  out.sort(function (a, b) { return zoneOf(ti, a) - zoneOf(ti, b); });
  return out;
}
function passerIndex(ti, z, passers) { return passerZones(ti, passers).indexOf(z); }

/* Base defence for the serving team: blockers at the net, diggers back, server behind the line. */
function defendPos(ti, z, isServer) {
  var front = FRONT_ZONES.indexOf(z) !== -1;
  if (isServer) return { x: zoneOf(ti, z), y: ti === 0 ? -1.15 : CL + 1.15 };
  var deep = function (m) { return ti === 0 ? m : CL - m; };
  if (front) return { x: zoneOf(ti, z), y: ti === 0 ? 8.1 : 9.9 };   // blockers press the net
  // zone 6 either steps up behind the block for tips, or holds deep for the swing
  if (z === 6) return { x: zoneOf(ti, z), y: deep(S.defSys === "6up" ? 5.4 : 1.5) };
  return { x: zoneOf(ti, z), y: deep(3.3) };
}

/* Does the drawn formation still satisfy the overlap rule? */
function overlapIssues(ti, spots) {
  var bad = [];
  // A team faces the net, so its own left sits on opposite screen sides per half:
  // home faces down (own left = screen right), away faces up (own left = screen left).
  // teamLeft() normalises that — larger value is further to the team's left.
  var teamLeft = function (x) { return ti === 0 ? x : CW - x; };
  OVERLAP_LR.forEach(function (p) {
    var a = spots[p[0]], b = spots[p[1]];
    if (!a || !b) return;
    if (!(teamLeft(a.x) > teamLeft(b.x))) bad.push("zone " + p[0] + " must stay left of zone " + p[1]);
  });
  OVERLAP_FB.forEach(function (p) {
    var f = spots[p[0]], b2 = spots[p[1]];
    if (!f || !b2) return;
    var ok = ti === 0 ? b2.y < f.y : b2.y > f.y;
    if (!ok) bad.push("zone " + p[1] + " must stay behind zone " + p[0]);
  });
  return bad;
}
/* A drawn formation has to be legal at the whistle. Templates are shaped for
   where players want to end up, so nudge them back onto the right side of the
   overlap rule: fix left-to-right order within each row, then push any back-row
   player who has crept in front of their counterpart behind them again. */
function repairOverlap(ti, spots) {
  var toL = function (x) { return ti === 0 ? x : CW - x; };
  var fromL = function (v) { return ti === 0 ? v : CW - v; };
  var GAP = 2.1, DGAP = 2.0;                 // a dot is 1.84 across, so leave room
  [[4, 3, 2], [5, 6, 1]].forEach(function (row) {
    var vals = row.map(function (z) { return toL(spots[z].x); }).sort(function (a, b) { return b - a; });
    for (var i = 1; i < vals.length; i++) {
      if (vals[i] > vals[i - 1] - GAP) vals[i] = vals[i - 1] - GAP;
    }
    // keep the row where the formation put it — force-centring here would wipe
    // out a deliberate pull left or right — and only slide it in if it overflows
    var origMean = row.reduce(function (s, z) { return s + toL(spots[z].x); }, 0) / row.length;
    var newMean = vals.reduce(function (s, v) { return s + v; }, 0) / vals.length;
    var delta = origMean - newMean;
    var hi = vals[0] + delta, lo2 = vals[vals.length - 1] + delta;
    if (lo2 < 0.85) delta += 0.85 - lo2;
    if (hi > CW - 0.85) delta -= hi - (CW - 0.85);
    row.forEach(function (z, i) { spots[z].x = fromL(vals[i] + delta); });
  });
  OVERLAP_FB.forEach(function (p) {
    var f = spots[p[0]], b = spots[p[1]];
    var okNow = ti === 0 ? b.y <= f.y - DGAP : b.y >= f.y + DGAP;
    if (okNow) return;
    if (ti === 0) b.y = Math.max(0.9, f.y - DGAP);
    else b.y = Math.min(CL - 0.9, f.y + DGAP);
  });
  return spots;
}

/* The overlap rule says nothing about, say, zone 2 versus zone 5, so two players
   can still be drawn on top of each other. Push any overlapping pair apart, then
   re-impose the rule, until the picture is both legal and readable. */
function relaxDots(ti, spots, skip) {
  var MIN = 2.0, zs = [1, 2, 3, 4, 5, 6];
  for (var iter = 0; iter < 30; iter++) {
    var moved = false;
    for (var i = 0; i < 6; i++) {
      for (var j = i + 1; j < 6; j++) {
        var za = zs[i], zb = zs[j];
        if (skip[za] || skip[zb]) continue;
        var a = spots[za], b = spots[zb];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d >= MIN) continue;
        var ux = d > 0.001 ? dx / d : 0, uy = d > 0.001 ? dy / d : 1;
        var push = (MIN - d) / 2 + 0.02;
        a.x -= ux * push; a.y -= uy * push;
        b.x += ux * push; b.y += uy * push;
        moved = true;
      }
    }
    zs.forEach(function (z) {
      if (skip[z]) return;
      spots[z].x = Math.max(0.85, Math.min(CW - 0.85, spots[z].x));
      spots[z].y = ti === 0 ? Math.max(0.9, Math.min(8.3, spots[z].y))
                            : Math.max(CL - 8.3, Math.min(CL - 0.9, spots[z].y));
    });
    repairOverlap(ti, spots);
    if (!moved) break;
  }
  return spots;
}

function posSpots(ti) {
  var t = S.teams[ti], mode = S.posMode || "rot", spots = {}, meta = {};
  var serving = S.serve === ti;
  for (var slot = 0; slot < 6; slot++) {
    var z = zoneOfSlot(t, slot) + 1;
    var role = t.roles ? t.roles[slot] : null;
    var isLib = !!(t.libOn && t.libOn.slot === slot);
    var isServer = serving && z === 1;
    var p;
    if (mode === "rot") p = basePos(ti, z);
    else if (mode === "recv") p = serving ? defendPos(ti, z, isServer) : receivePos(ti, z, role, S.passers || 3, isServer);
    else p = serving ? defendPos(ti, z, isServer) : basePos(ti, z);
    spots[z] = p;
    meta[z] = { n: isLib ? t.libOn.n : t.order[slot], role: isLib ? "L" : role, lib: isLib, server: isServer, slot: slot };
  }
  if (mode !== "rot") {
    var skip = {};
    for (var z2 = 1; z2 <= 6; z2++) if (meta[z2] && meta[z2].server) skip[z2] = true;
    repairOverlap(ti, spots);
    relaxDots(ti, spots, skip);
  }
  return { spots: spots, meta: meta, serving: serving };
}

function viewPositions() {
  var mode = S.posMode || "rot", passers = S.passers || 3;
  var PAD = 1.5, W = CW + PAD * 2, H = CL + 5.0;
  var sx = function (x) { return x + PAD; }, sy = function (y) { return y + 2.5; };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="posvg">';
  // court
  svg += '<rect x="' + sx(0) + '" y="' + sy(0) + '" width="' + CW + '" height="' + CL + '" fill="#0E2130" stroke="#EDF1EE" stroke-width=".12"/>';
  svg += '<line x1="' + sx(0) + '" y1="' + sy(9) + '" x2="' + sx(CW) + '" y2="' + sy(9) + '" stroke="var(--ball)" stroke-width=".2"/>';
  [6, 12].forEach(function (y) {
    svg += '<line x1="' + sx(0) + '" y1="' + sy(y) + '" x2="' + sx(CW) + '" y2="' + sy(y) + '" stroke="#EDF1EE" stroke-width=".07" opacity=".45"/>';
  });
  svg += '<text x="' + sx(CW / 2) + '" y="' + (sy(9) - 0.28) + '" text-anchor="middle" font-size=".55" fill="var(--ball)" opacity=".9" letter-spacing=".14">NET</text>';

  var issues = [];
  [0, 1].forEach(function (ti) {
    var r = posSpots(ti), t = S.teams[ti], st = tStyle(ti);
    var bad = overlapIssues(ti, r.spots);
    if (bad.length) issues.push({ ti: ti, msgs: bad });
    [1, 2, 3, 4, 5, 6].forEach(function (z) {
      var p = r.spots[z], m = r.meta[z];
      var fill = m.lib ? "var(--lib)" : st.fill === "transparent" ? "#22303B" : st.fill;
      var ink = m.lib ? "#06211D" : st.text;
      svg += '<g>' +
        (m.server ? '<circle cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r="1.2" fill="none" stroke="var(--ball)" stroke-width=".16"/>' : "") +
        '<circle cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r=".95" fill="' + fill + '" stroke="' + (m.lib ? "var(--lib)" : st.line) + '" stroke-width=".1"/>' +
        '<text x="' + sx(p.x) + '" y="' + (sy(p.y) + (m.role ? 0.03 : 0.25)) + '" text-anchor="middle" font-size="' +
          (m.role ? ".64" : ".74") + '" font-weight="800" fill="' + ink + '">' + esc(m.n) + '</text>' +
        (m.role ? '<text x="' + sx(p.x) + '" y="' + (sy(p.y) + 0.66) + '" text-anchor="middle" font-size=".34" font-weight="800" letter-spacing=".02" fill="' + ink + '" opacity=".72">' + m.role + '</text>' : "") +
        '</g>';
    });
  });
  svg += '</svg>';

  var warn = issues.length
    ? issues.map(function (i) {
        return '<p class="posbad">' + esc(S.teams[i.ti].name) + ': ' + i.msgs.join(" · ") + '</p>';
      }).join("")
    : '<p class="posok">Overlap is legal — every back-row player is behind their front-row counterpart and the left-to-right order holds.</p>';

  var untagged = [0, 1].filter(function (i) { return !S.teams[i].roles; })
    .map(function (i) { return S.teams[i].name; });
  return '<div class="posbox">' +
    '<div class="seg3 noprint">' +
      ['rot|Rotational', 'recv|Serve receive', 'def|Base defence'].map(function (o) {
        var p = o.split("|");
        return '<button class="segb' + (mode === p[0] ? " on" : "") + '" data-pos="' + p[0] + '">' + p[1] + '</button>';
      }).join("") + '</div>' +
    (mode === "recv"
      ? '<div class="seg3 noprint" style="margin-top:7px">' +
          [2, 3, 4].map(function (n) {
            return '<button class="segb' + (passers === n ? " on" : "") + '" data-pass="' + n + '">' + n + ' passers</button>';
          }).join("") + '</div>' +
        '<div class="seg3 noprint" style="margin-top:6px">' +
          [["L", "Pull left"], ["E", "Even"], ["R", "Pull right"]].map(function (o) {
            return '<button class="segb' + ((S.shift || "E") === o[0] ? " on" : "") + '" data-shift="' + o[0] + '">' + o[1] + '</button>';
          }).join("") + '</div>' +
        '<div class="seg3 noprint" style="margin-top:6px">' +
          [["up", "Short serve"], ["base", "Base"], ["deep", "Deep serve"]].map(function (o) {
            return '<button class="segb' + ((S.rdepth || "base") === o[0] ? " on" : "") + '" data-rdepth="' + o[0] + '">' + o[1] + '</button>';
          }).join("") + '</div>'
      : mode === "def"
      ? '<div class="seg noprint" style="margin-top:7px;grid-template-columns:1fr 1fr">' +
          [["6back", "6-back"], ["6up", "6-up"]].map(function (o) {
            return '<button class="segb' + ((S.defSys || "6back") === o[0] ? " on" : "") + '" data-defsys="' + o[0] + '">' + o[1] + '</button>';
          }).join("") + '</div>'
      : "") +
    svg + warn +
    (untagged.length && mode !== "rot"
      ? '<p class="posbad">No setter tagged for ' + esc(untagged.join(" or ")) +
        ' — long-press a player on the Court view to tag one, or this side just holds its rotational spots.</p>'
      : "") +
    '<p class="note">' +
      (mode === "rot"
        ? "Where each player must stand at the moment of serve. This is the rule baseline — the relative order here is what referees judge."
        : mode === "recv"
        ? "Receiving team in a " + passers + "-passer look" +
          (S.shift === "L" ? ", pulled to their left" : S.shift === "R" ? ", pulled to their right" : "") +
          (S.rdepth === "up" ? ", stepped up for a short serve" : S.rdepth === "deep" ? ", dropped for a deep or jump serve" : "") +
          "; serving team in base. These are legal positions at the whistle — the setter and hitters release to the net the instant the ball is contacted. Formations vary by team, so treat the shape as a starting point."
        : "Serving team in " + ((S.defSys || "6back") === "6up" ? "6-up — zone 6 steps in behind the block to cover tips" : "6-back — zone 6 holds deep for the hard swing") +
          ", server behind the end line. The receiving side is shown at its rotational spots.") +
      ' Once the server contacts the ball everyone may move, subject to the back-row attack and libero restrictions.</p>' +
  '</div>';
}

/* ---------- sheets ---------- */
function openSheet(kind, ti, extra) { sheet = { kind: kind, ti: ti, extra: extra === undefined ? null : extra, buf: "" }; drawSheet(); }
function closeSheet() { sheet = null; var s = document.querySelector(".scrim"); if (s) s.remove(); }

function drawSheet() {
  var old = document.querySelector(".scrim"); if (old) old.remove();
  if (!sheet) return;
  var t = S.teams[sheet.ti], html = "";

  if (sheet.kind === "fix") {
    html = '<h3>Fix ' + esc(t.name) + '</h3>' +
      '<p class="sub">Nothing here touches the score, the serve, or your substitution count. Use it when the app and the court have drifted apart.</p>' +
      '<p class="sub" style="margin-bottom:6px"><b>Rotation</b> — currently #' + esc(atZone(t, 0)) + ' in zone 1.</p>' +
      '<div class="row">' +
        '<button class="btn" data-rot="' + sheet.ti + '|-1">↺ Back one</button>' +
        '<button class="btn" data-rot="' + sheet.ti + '|1">Forward one ↻</button>' +
      '</div>' +
      '<p class="sub" style="margin-top:12px"><b>Swap two players</b> — on the court view, drag one player onto another to swap their spots in the serving order.</p>' +
      '<div class="hair"></div><button class="btn ghost wide" data-close="1">Done</button>';
  }

  if (sheet.kind === "cell") {
    var cslot = sheet.extra, onLib = !!(t.libOn && t.libOn.slot === cslot);
    var who = onLib ? t.libOn.n : t.order[cslot];
    if (sheet.mode === "fix") {
      html = '<h3>Correct #' + esc(who) + '</h3>' +
        '<p class="sub">Fixes a number typed wrong at line-up. This is not a substitution — no sub is spent, and the score sheet is rewritten to match.' +
        (onLib ? ' Changing the libero\'s number.' : '') + '</p>' +
        '<div class="bigbuf">' + (sheet.buf ? esc(sheet.buf) : '<span class="ph">–</span>') + '</div>' +
        keypad("Save") +
        '<div class="hair"></div><button class="btn ghost wide" data-cellback="1">Back</button>';
    } else {
      var role = t.roles && t.roles[cslot];
      html = '<h3>#' + esc(who) + ' — ' + ZONE_NAME[zoneOfSlot(t, cslot)].split(" · ")[0] + '</h3>' +
        '<p class="sub">Serving order ' + ROMAN[cslot] + (role ? ' · ' + (ROLE_FULL[role] || role) : '') +
        (onLib ? ' · libero on court here' : '') + '</p>' +
        '<button class="btn wide" data-cellfix="1">Correct this number</button>' +
        '<div style="height:8px"></div>' +
        (t.liberos.length ? (function () {
          var planned = t.libServePlan === cslot, locked = t.libServeSlot === cslot;
          var other = t.libServeSlot !== null && t.libServeSlot !== cslot;
          return '<button class="btn wide" data-libserve="1"' + (other ? " disabled" : "") + '>' +
            (locked ? "Libero already serves here (locked)"
                    : planned ? "✓ Libero serves here — tap to clear"
                    : "Libero serves in this spot") + '</button>' +
            '<p class="sub" style="margin-top:8px">' +
            (other ? "The libero already served from " + ROMAN[t.libServeSlot] + " this set, so that spot is locked by rule."
                   : "Pick which middle's spot the libero serves in. Auto-tracking then leaves the other middle in to serve their own turn.") +
            '</p><div style="height:8px"></div>';
        })() : "") +
        (onLib ? '<p class="sub">Take the libero out to tag the player underneath as setter.</p>'
               : '<button class="btn wide" data-setter="1">Tag as setter' +
                 (role === "S" ? ' (already)' : '') + '</button>' +
                 '<p class="sub" style="margin-top:8px">Sets the other five roles from the three-apart pattern. Roles stay with the spot, so subs inherit them.</p>') +
        '<div class="hair"></div><button class="btn ghost wide" data-close="1">Close</button>';
    }
  }

  if (sheet.kind === "sub") {
    if (sheet.extra === null) {
      html = '<h3>Substitution — ' + esc(t.name) + '</h3>' +
        '<p class="sub">' + (SUB_LIMIT - t.subs) + ' of ' + SUB_LIMIT + ' subs left this set. Pick the spot in the serving order to change.</p>' +
        [0, 1, 2, 3, 4, 5].map(function (z) {
          var slot = slotAtZone(t, z), n = t.order[slot];
          var libHere = t.libOn && t.libOn.slot === slot;
          var elig = subEligible(t, slot);
          return '<button class="orow' + (libHere ? " lib" : "") + '" data-subslot="' + slot + '">' +
            '<span class="z">' + ZONE_NAME[z] + '</span><span class="n">#' + esc(n) + '</span>' +
            '<span class="d">' + (libHere ? "Libero #" + t.libOn.n + " is covering this spot" :
              elig.length ? elig.length + " eligible: #" + elig.map(function (p) { return p.n; }).join(", #") : "no one eligible") + '</span></button>';
        }).join("") +
        '<p class="note">A player may come back in as often as you like, but only ever into the same slot in the serving order.</p>' +
        '<div class="hair"></div><button class="btn ghost wide" data-close="1">Cancel</button>';
    } else {
      var slot = sheet.extra, elig = subEligible(t, slot), buf = sheet.buf || "";
      html = '<h3>#' + esc(t.order[slot]) + ' comes out</h3>' +
        '<p class="sub">Zone ' + (zoneOfSlot(t, slot) + 1) + ' · punch in who\'s going in.</p>' +
        (elig.length ? '<p class="note" style="margin:0 0 8px">Back in from earlier:</p><div class="chips" style="margin-bottom:4px">' +
          elig.map(function (n) {
            return '<button class="chip" data-subin="' + slot + "|" + esc(n) + '">' + esc(n) + '<span class="sub">RE-ENTRY</span></button>';
          }).join("") + '</div>' : "") +
        '<div class="buf' + (buf ? "" : " empty") + '">' + (buf ? "#" + esc(buf) : "#–") + '</div>' +
        keypad("Sub in") +
        '<p class="note">Any number is fine — new players get added as they enter. A player who has already been on in a different spot can\'t come in here.</p>' +
        '<div class="hair"></div><button class="btn ghost wide" data-subslot="back">Back</button>';
    }
  }

  if (sheet.kind === "libero") {
    if (!t.liberos.length) {
      html = '<h3>No libero designated</h3><p class="sub">' + esc(t.name) + ' didn\'t list a libero at setup. Start a new match to add one.</p>' +
        '<button class="btn ghost wide" data-close="1">Close</button>';
    } else if (t.libOn) {
      html = '<h3>Libero #' + esc(t.libOn.n) + ' is on</h3>' +
        '<p class="sub">Covering #' + esc(t.order[t.libOn.slot]) + ' in ' + ZONE_NAME[zoneOfSlot(t, t.libOn.slot)] + '. ' +
        'She comes out automatically when that slot rotates to the front row.</p>' +
        '<button class="btn primary wide" data-libout="' + sheet.ti + '">Take #' + esc(t.libOn.n) + ' out, #' + esc(t.order[t.libOn.slot]) + ' back in</button>' +
        '<div class="hair"></div><button class="btn ghost wide" data-close="1">Cancel</button>';
    } else {
      var libs = t.liberos;
      var pick = sheet.extra || libs[0];
      html = '<h3>Bring the libero in — ' + esc(t.name) + '</h3>' +
        '<p class="sub">Back row only. Doesn\'t count as a substitution.</p>' +
        (libs.length > 1 ? '<div class="chips" style="margin-bottom:12px">' + libs.map(function (n) {
          return '<button class="chip libmark' + (n === pick ? " on" : "") + '" data-libpick="' + esc(n) + '">' + esc(n) + '</button>';
        }).join("") + '</div>' : "") +
        BACK_ZONES.map(function (z) {
          var slot = slotAtZone(t, z), n = t.order[slot];
          var blocked = (t.libServeSlot !== null && z === 0 && S.serve === sheet.ti && t.libServeSlot !== slot);
          return '<button class="orow" data-libin="' + slot + "|" + pick + '"' + (blocked ? " disabled" : "") + '>' +
            '<span class="z">' + ZONE_NAME[z] + '</span><span class="n">#' + esc(n) + '</span>' +
            '<span class="d">' + (blocked ? "libero already has a serving slot" :
              (z === 0 && S.serve === sheet.ti ? "#" + pick + " would serve — locks the serving slot" : "replace #" + n)) + '</span></button>';
        }).join("") +
        '<p class="note">USAV lets the libero serve in exactly one rotation slot per set. The first slot she serves from is the only one for the rest of the set.</p>' +
        '<div class="hair"></div><button class="btn ghost wide" data-close="1">Cancel</button>';
    }
  }

  var d = document.createElement("div");
  d.className = "scrim";
  d.innerHTML = '<div class="sheet">' + html + '</div>';
  d.addEventListener("click", function (e) { if (e.target === d) closeSheet(); });
  document.body.appendChild(d);
}

/* ---------- events ---------- */
/* Called on every render: only binds to elements that are rebuilt each time. */
function wire() { /* nothing rebuilt per-render needs binding */ }

/* Bound exactly once at boot — #app survives every render, so re-binding here
   would stack duplicate handlers and fire each tap several times. */
/* Long-press a player to correct their number or tag them setter.
   Cancels on movement so scrolling the court never triggers it. */
function wireLongPress() {
  var lpT = null, sx0 = 0, sy0 = 0, el0 = null, dragging = false, lastDrop = null;

  function clearAll() {
    clearTimeout(lpT); lpT = null;
    if (el0) el0.classList.remove("dragging");
    if (lastDrop) lastDrop.classList.remove("droptarget");
    el0 = null; lastDrop = null; dragging = false;
  }
  function parse(el) { var p = el.getAttribute("data-cell").split("|"); return { ti: +p[0], slot: +p[1] }; }

  document.addEventListener("pointerdown", function (e) {
    var c = e.target.closest("[data-cell]");
    if (!c || S.phase !== "match" || S.view !== "court") return;
    el0 = c; sx0 = e.clientX; sy0 = e.clientY; dragging = false;
    clearTimeout(lpT);
    lpT = setTimeout(function () {
      if (!el0 || dragging) return;
      var p = parse(el0);
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (err) {} }
      var keep = el0; clearAll();
      openSheet("cell", p.ti, p.slot);
      keep.classList.remove("dragging");
    }, 500);
  }, { passive: true });

  document.addEventListener("pointermove", function (e) {
    if (!el0) return;
    var moved = Math.abs(e.clientX - sx0) > 10 || Math.abs(e.clientY - sy0) > 10;
    if (!moved) return;
    if (!dragging) {                       // movement means a drag, not a long press
      clearTimeout(lpT); lpT = null;
      dragging = true;
      el0.classList.add("dragging");
    }
    var over = document.elementFromPoint(e.clientX, e.clientY);
    var cell2 = over && over.closest ? over.closest("[data-cell]") : null;
    var valid = cell2 && cell2 !== el0 && parse(cell2).ti === parse(el0).ti;
    if (lastDrop && lastDrop !== cell2) lastDrop.classList.remove("droptarget");
    if (valid) { cell2.classList.add("droptarget"); lastDrop = cell2; }
    else lastDrop = null;
  }, { passive: true });

  document.addEventListener("pointerup", function (e) {
    if (dragging && el0) {
      var over = document.elementFromPoint(e.clientX, e.clientY);
      var cell2 = over && over.closest ? over.closest("[data-cell]") : null;
      if (cell2 && cell2 !== el0) {
        var a = parse(el0), b = parse(cell2);
        if (a.ti === b.ti) { clearAll(); return swapSlots(a.ti, a.slot, b.slot); }
        toast("You can only swap within the same team");
      }
    }
    clearAll();
  });

  ["pointercancel", "scroll"].forEach(function (evt) {
    document.addEventListener(evt, clearAll, { passive: true });
  });
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest("[data-cell]")) e.preventDefault();
  });
}

function wireOnce() {
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;

    /* --- open sheet takes priority --- */
    if (sheet) {
      var sel = e.target.closest("[data-subslot],[data-subin],[data-libin],[data-libout],[data-libpick],[data-close],[data-key],[data-cellfix],[data-cellback],[data-setter],[data-libserve],[data-rot]");
      if (sel) {
        var v;
        if (sel.getAttribute("data-close")) return closeSheet();
        if (sel.getAttribute("data-cellfix")) { sheet.mode = "fix"; sheet.buf = ""; return drawSheet(); }
        if (sel.getAttribute("data-cellback")) { sheet.mode = null; sheet.buf = ""; return drawSheet(); }
        if (sel.getAttribute("data-setter")) { return setSetter(sheet.ti, sheet.extra); }
        if (sel.getAttribute("data-libserve")) { return setLiberoServeSpot(sheet.ti, sheet.extra); }
        if ((v = sel.getAttribute("data-rot"))) {
          var rp = v.split("|"); closeSheet(); return nudgeRotation(+rp[0], +rp[1]);
        }
        if ((v = sel.getAttribute("data-subslot")) !== null) { sheet.extra = v === "back" ? null : +v; sheet.buf = ""; return drawSheet(); }
        if ((v = sel.getAttribute("data-key")) !== null) {
          var b = sheet.buf || "";
          if (v === "del") sheet.buf = b.slice(0, -1);
          else if (v === "ok") {
            if (sheet.kind === "fix") {
    html = '<h3>Fix ' + esc(t.name) + '</h3>' +
      '<p class="sub">Nothing here touches the score, the serve, or your substitution count. Use it when the app and the court have drifted apart.</p>' +
      '<p class="sub" style="margin-bottom:6px"><b>Rotation</b> — currently #' + esc(atZone(t, 0)) + ' in zone 1.</p>' +
      '<div class="row">' +
        '<button class="btn" data-rot="' + sheet.ti + '|-1">↺ Back one</button>' +
        '<button class="btn" data-rot="' + sheet.ti + '|1">Forward one ↻</button>' +
      '</div>' +
      '<p class="sub" style="margin-top:12px"><b>Swap two players</b> — on the court view, drag one player onto another to swap their spots in the serving order.</p>' +
      '<div class="hair"></div><button class="btn ghost wide" data-close="1">Done</button>';
  }

  if (sheet.kind === "cell") {
              var ct = S.teams[sheet.ti];
              var wasLib = !!(ct.libOn && ct.libOn.slot === sheet.extra);
              return correctNumber(sheet.ti, sheet.extra, b, wasLib);
            }
            return doSub(sheet.ti, sheet.extra, b);
          }
          else sheet.buf = b.length >= 2 ? v : b + v;
          return drawSheet();
        }
        if ((v = sel.getAttribute("data-subin"))) { var s1 = v.split("|"); return doSub(sheet.ti, +s1[0], s1[1]); }
        if ((v = sel.getAttribute("data-libpick"))) { sheet.extra = v; return drawSheet(); }
        if ((v = sel.getAttribute("data-libin"))) { var s2 = v.split("|"); return liberoIn(sheet.ti, s2[1], +s2[0]); }
        if ((v = sel.getAttribute("data-libout")) !== null) { return liberoOut(+v); }
        return;
      }
      if (e.target.closest(".sheet")) return;
    }

    var el = e.target.closest("[data-box],[data-key],[data-ok],[data-pt],[data-sub],[data-libx],[data-to],[data-view],[data-color],[data-sys],[data-role],[data-autolib],[data-pos],[data-pass],[data-shift],[data-rdepth],[data-defsys],[data-fs],[data-fix],#go,#undo,#newm,#nxt,#print,#dl,#clr");
    if (!el) return;
    var d;
    if ((d = el.getAttribute("data-box")) !== null) {
      var i = +d;
      S.entry.prefilled = false;
      S.entry.active = i;
      if (i >= 6) S.entry.lib[i - 6] = ""; else S.entry.z[i] = "";
      save(); render(); return;
    }
    if ((d = el.getAttribute("data-key")) !== null) { entryKey(d); return; }
    if ((d = el.getAttribute("data-view"))) { S.view = d; save(); render(); return; }
    if ((d = el.getAttribute("data-autolib")) !== null) { toggleAutoLib(+d); return; }
    if ((d = el.getAttribute("data-pos"))) { S.posMode = d; save(); render(); return; }
    if ((d = el.getAttribute("data-pass"))) { S.passers = +d; save(); render(); return; }
    if ((d = el.getAttribute("data-shift"))) { S.shift = d; save(); render(); return; }
    if ((d = el.getAttribute("data-rdepth"))) { S.rdepth = d; save(); render(); return; }
    if ((d = el.getAttribute("data-defsys"))) { S.defSys = d; save(); render(); return; }
    if ((d = el.getAttribute("data-fs")) !== null) { setFirstServe(+d); return; }
    if ((d = el.getAttribute("data-fix")) !== null) { openSheet("fix", +d, null); return; }
    if ((d = el.getAttribute("data-sys"))) {
      var sp = d.split("|");
      S.teams[+sp[0]].system = sp[1];
      if (sp[1] !== "manual" && S.entry && S.entry.roles) {
        var s0 = S.entry.roles.indexOf("S");
        S.entry.roles = s0 === -1 ? null : deriveRoles(s0, sp[1]);
      }
      save(); render(); return;
    }
    if ((d = el.getAttribute("data-role"))) {
      var rp = d.split("|"), rti = +rp[0], ri = +rp[1], te = S.entry;
      if (S.teams[rti].system === "manual") {
        if (!te.roles) te.roles = [null, null, null, null, null, null];
        var cy = ROLE_CYCLE.indexOf(te.roles[ri] || "");
        te.roles[ri] = ROLE_CYCLE[(cy + 1) % ROLE_CYCLE.length] || null;
      } else {
        te.roles = deriveRoles(ri, S.teams[rti].system);
      }
      save(); render(); return;
    }
    if ((d = el.getAttribute("data-color"))) {
      var cp = d.split("|");
      if ($("n0")) S.teams[0].name = $("n0").value;
      if ($("n1")) S.teams[1].name = $("n1").value;
      S.teams[+cp[0]].color = cp[1];
      save(); render(); return;
    }
    if ((d = el.getAttribute("data-ok")) !== null) { confirmLineup(+d); return; }
    if ((d = el.getAttribute("data-pt")) !== null) { point(+d); return; }
    if ((d = el.getAttribute("data-sub")) !== null) { openSheet("sub", +d, null); return; }
    if ((d = el.getAttribute("data-libx")) !== null) { openSheet("libero", +d); return; }
    if ((d = el.getAttribute("data-to")) !== null) { timeout(+d); return; }
    if (el.id === "go") { startMatch(); return; }
    if (el.id === "clr") { S.entry = blankEntry(); save(); render(); return; }
    if (el.id === "print") { printSheet(); return; }
    if (el.id === "dl") { downloadSheet(); return; }
    if (el.id === "undo") { undo(); return; }
    if (el.id === "nxt") { nextSet(); return; }
    if (el.id === "newm") {
      if (!confirm("Start a new match? This clears the current one.")) return;
      S = newMatch(); save(); render(); return;
    }
  });
}

/* ---------- saving the sheet ---------- */
function printSheet() {
  if (S.view !== "sheet") { S.view = "sheet"; render(); }
  setTimeout(function () {
    try { window.print(); }
    catch (e) { toast("Printing is blocked here — use Download file"); }
  }, 120);
}

/* Standalone copy of the sheet, styles inlined, so it opens anywhere later. */
function downloadSheet() {
  try {
    var css = document.querySelector("style").textContent;
    var when = new Date().toISOString().slice(0, 10);
    var title = S.teams[0].name + " v " + S.teams[1].name + " — " + when;
    var doc = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(title) + '</title><style>' + css +
      'body{background:#fff;padding:14px}.wrap{max-width:760px}h1{color:#14110C;font-size:17px;margin:0 0 12px}</style>' +
      '</head><body><div class="wrap"><h1>' + esc(title) + '</h1>' + viewSheetAll() + '</div></body></html>';
    var url = URL.createObjectURL(new Blob([doc], { type: "text/html" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = (S.teams[0].name + "-v-" + S.teams[1].name + "-" + when + ".html").replace(/[^\w.\-]+/g, "_");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast("Score sheet saved", true);
  } catch (e) { toast("Couldn't save the file here"); }
}

/* ---------- persistence ---------- */
var saveT = null;
function writeState() {
  try { store.set("sideout:match", JSON.stringify({ S: S })); } catch (e) {}
}
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(writeState, 120);
}
/* A phone can lock or swap apps mid-debounce — commit before we lose the page. */
function flushSave() { if (saveT) { clearTimeout(saveT); saveT = null; } writeState(); }
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") flushSave();
});
window.addEventListener("pagehide", flushSave);
window.addEventListener("blur", flushSave);
function boot() {
  store.get("sideout:match").then(function (raw) {
    if (raw) {
      try {
        var o = JSON.parse(raw);
        if (o && o.S && o.S.teams && o.S.teams.length === 2) S = o.S;
      } catch (e) {}
    }
    if (!S) S = newMatch();
    if (!S.undo) S.undo = [];
    if (S.phase === "lineup" && !S.entry) S.entry = entryFor(S.lineupFor || 0);
    wireOnce();
  wireLongPress();
    render();
  }, function () { S = newMatch(); wireOnce(); render(); });
}
boot();

/* Installed-app plumbing. Only runs when served over http(s); opening the
   file straight off disk just skips it. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
